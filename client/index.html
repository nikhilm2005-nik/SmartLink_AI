<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartLink AI - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .navbar { background: #16213e; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a1a3e; }
        .navbar-brand { font-size: 20px; color: #4fc3f7; font-weight: 700; }
        .navbar-right { display: flex; align-items: center; gap: 12px; }
        .navbar-user { font-size: 13px; color: #aaa; }
        .container { max-width: 900px; margin: 40px auto; padding: 24px 20px; }
        .card { background: #16213e; border-radius: 12px; padding: 28px; border: 1px solid #1e2d50; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; margin-top: 14px; }
        label:first-child { margin-top: 0; }
        input { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #2a3a5e; background: #0f0f1a; color: #e0e0e0; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #4fc3f7; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; background: linear-gradient(135deg, #4fc3f7, #0288d1); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.88; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { padding: 6px 14px; background: #1e2d50; color: #aaa; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.2s, color 0.2s; }
        .btn-outline:hover { background: #2a3a5e; color: #fff; }
        .error-msg { color: #ef5350; font-size: 13px; margin-top: 10px; display: none; }
        .error-msg.show { display: block; }
        
        /* Stats & Table Styles */
        .stats-grid { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #16213e; border-radius: 12px; padding: 24px; border: 1px solid #1e2d50; text-align: center; }
        .stat-title { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 36px; font-weight: 700; color: #4fc3f7; margin-top: 10px; }
        
        .table-wrapper { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { padding: 14px 12px; background: #111a30; color: #4fc3f7; border-bottom: 2px solid #2a3a5e; font-weight: 600; }
        td { padding: 14px 12px; border-bottom: 1px solid #1e2d50; color: #e0e0e0; }
        tr:hover { background: #1a2642; }
        .short-link-text { color: #4fc3f7; text-decoration: none; font-weight: 600; }
        .short-link-text:hover { text-decoration: underline; }
        .truncate { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
        .btn-delete { background: none; border: none; color: #ef5350; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
        .btn-delete:hover { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="navbar-brand">SmartLink AI</span>
        <div class="navbar-right">
            <span class="navbar-user" id="navUser"></span>
            <button class="btn-outline" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <div class="container">
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Links</div>
                <div class="stat-value" id="statTotalLinks">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Clicks</div>
                <div class="stat-value" id="statTotalClicks">...</div>
            </div>
        </div>

        <div class="card">
            <h3 style="color:#fff; font-size:18px; margin-bottom: 16px;">Create a Short Link</h3>
            <label>Destination URL</label>
            <input type="url" id="longUrl" placeholder="https://example.com/my-super-long-link" required />
            <label>Custom Alias (Optional)</label>
            <input type="text" id="customAlias" placeholder="e.g., my-campaign" />
            <button class="btn" onclick="shortenUrl()" style="margin-top: 20px;">Shorten URL</button>
            <p class="error-msg" id="errorMsg"></p>
        </div>

        <div class="card" id="resultCard" style="display: none; border-color: #4fc3f7;">
            <h4 style="color:#4fc3f7; margin-bottom: 10px;">Your link is ready!</h4>
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <input type="text" id="shortUrlResult" readonly style="background: #0f0f1a; border: 1px solid #2a3a5e; color: #4fc3f7; font-weight: bold;" />
                <button class="btn-outline" onclick="copyToClipboard()" style="margin-top: 0; padding: 11px 16px;">Copy</button>
            </div>
            <div style="text-align: center;">
                <img id="qrCodeImage" src="" alt="QR Code" style="border-radius: 8px; border: 4px solid #fff; max-width: 140px; display: none; margin: 0 auto;" />
            </div>
        </div>

        <div class="card">
            <h3 style="color:#fff; font-size:18px;">Your Links</h3>
            <div class="table-wrapper">
                <table id="linksTable">
                    <thead>
                        <tr>
                            <th>Original URL</th>
                            <th>Short Link</th>
                            <th>Clicks</th>
                            <th>Date Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody">
                        <tr><td colspan="5" style="text-align: center; color: #aaa;">Loading your links...</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="noLinksMsg" style="color: #aaa; font-size: 13px; margin-top: 15px; display: none; text-align: center;">You haven't created any links yet.</p>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5000';
        const token = localStorage.getItem('smartlink_token');
        if (!token) window.location.href = 'login.html';

        const user = JSON.parse(localStorage.getItem('smartlink_user') || '{}');
        if (user.name) document.getElementById('navUser').textContent = user.name;

        function logout() {
            localStorage.removeItem('smartlink_token');
            localStorage.removeItem('smartlink_user');
            window.location.href = 'login.html';
        }

        // --- NEW: LOAD ANALYTICS ---
        async function loadAnalytics() {
            try {
                const res = await fetch(`${BASE_URL}/api/analytics`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    // Animate the numbers in for a premium feel
                    document.getElementById('statTotalLinks').textContent = data.totalLinks;
                    document.getElementById('statTotalClicks').textContent = data.totalClicks;
                }
            } catch (err) {
                console.error("Error loading analytics:", err);
                document.getElementById('statTotalLinks').textContent = "-";
                document.getElementById('statTotalClicks').textContent = "-";
            }
        }

        // --- LOAD URL HISTORY ---
        async function loadHistory() {
            try {
                const res = await fetch(`${BASE_URL}/api/my-urls`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Failed to fetch URLs');
                
                const urls = await res.json();
                const tbody = document.getElementById('linksTableBody');
                const noLinksMsg = document.getElementById('noLinksMsg');
                const linksTable = document.getElementById('linksTable');
                
                tbody.innerHTML = ''; 
                
                if (urls.length === 0) {
                    noLinksMsg.style.display = 'block';
                    linksTable.style.display = 'none';
                    return;
                }
                
                linksTable.style.display = 'table';
                noLinksMsg.style.display = 'none';

                urls.forEach(url => {
                    const shortUrlFull = `${BASE_URL}/${url.shortCode}`;
                    const date = new Date(url.createdAt).toLocaleDateString();
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><span class="truncate" title="${url.originalUrl}">${url.originalUrl}</span></td>
                        <td><a href="${shortUrlFull}" target="_blank" class="short-link-text">${url.shortCode}</a></td>
                        <td>${url.clicks.length}</td>
                        <td>${date}</td>
                        <td>
                            <div style="display: flex; gap: 12px; align-items: center;">
                                ${url.qrCode ? `<a href="${url.qrCode}" download="qr-${url.shortCode}.png" class="short-link-text">QR</a>` : '<span style="color:#aaa">N/A</span>'}
                                <button onclick="deleteUrl('${url._id}')" class="btn-delete">Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading history:", err);
            }
        }

        // --- MASTER REFRESH FUNCTION ---
        // Call this whenever data changes to update both the table and the cards
        function refreshDashboard() {
            loadAnalytics();
            loadHistory();
        }

        // Trigger on initial page load
        refreshDashboard();

        // --- DELETE URL LOGIC ---
        async function deleteUrl(urlId) {
            if (!confirm("Are you sure you want to delete this link? This cannot be undone.")) return;

            try {
                const res = await fetch(`${BASE_URL}/api/${urlId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) refreshDashboard(); // Update table AND numbers!
            } catch (err) {
                alert('Server error. Could not delete link.');
            }
        }

        // --- SHORTEN URL LOGIC ---
        async function shortenUrl() {
            const originalUrl = document.getElementById('longUrl').value.trim();
            const customAlias = document.getElementById('customAlias').value.trim();
            const btn = document.querySelector('.btn');
            const errorMsg = document.getElementById('errorMsg');
            const resultCard = document.getElementById('resultCard');
            const shortUrlResult = document.getElementById('shortUrlResult');
            const qrImg = document.getElementById('qrCodeImage');
            
            errorMsg.classList.remove('show');
            resultCard.style.display = 'none';
            qrImg.style.display = 'none';

            if (!originalUrl) {
                errorMsg.textContent = 'Please enter a valid URL';
                errorMsg.classList.add('show'); return;
            }

            btn.disabled = true; btn.textContent = 'Generating...';

            try {
                const res = await fetch(`${BASE_URL}/api/shorten`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ originalUrl, customAlias })
                });
                
                const data = await res.json();
                if (!res.ok) { errorMsg.textContent = data.error || 'Failed to shorten link'; errorMsg.classList.add('show'); return; }

                document.getElementById('longUrl').value = '';
                document.getElementById('customAlias').value = '';
                shortUrlResult.value = data.shortUrl;
                
                if (data.qrCode) {
                    qrImg.src = data.qrCode;
                    qrImg.style.display = 'block';
                }
                
                resultCard.style.display = 'block';
                refreshDashboard(); // Update table AND numbers!

            } catch (err) {
                errorMsg.textContent = 'Server error. Is the backend running?';
                errorMsg.classList.add('show');
            } finally {
                btn.disabled = false; btn.textContent = 'Shorten URL';
            }
        }

        function copyToClipboard() {
            const copyText = document.getElementById("shortUrlResult");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            const copyBtn = document.querySelector('#resultCard .btn-outline');
            copyBtn.textContent = 'Copied!'; copyBtn.style.background = '#4fc3f7'; copyBtn.style.color = '#000';
            setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.style.background = '#1e2d50'; copyBtn.style.color = '#aaa'; }, 2000);
        }
    </script>
</body>
</html>
