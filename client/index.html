<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartLink AI - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .navbar { background: #16213e; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a1a3e; }
        .navbar-brand { font-size: 20px; color: #4fc3f7; font-weight: 700; }
        .navbar-right { display: flex; align-items: center; gap: 12px; }
        .navbar-user { font-size: 13px; color: #aaa; }
        .container { max-width: 900px; margin: 40px auto; padding: 24px 20px; }
        .card { background: #16213e; border-radius: 12px; padding: 28px; border: 1px solid #1e2d50; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; margin-top: 14px; }
        label:first-child { margin-top: 0; }
        
        input, select { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #2a3a5e; background: #0f0f1a; color: #e0e0e0; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: #4fc3f7; }
        
        .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; background: linear-gradient(135deg, #4fc3f7, #0288d1); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.88; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { padding: 6px 14px; background: #1e2d50; color: #aaa; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.2s, color 0.2s; }
        .btn-outline:hover:not(:disabled) { background: #2a3a5e; color: #fff; }
        .btn-outline:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .error-msg { color: #ef5350; font-size: 13px; margin-top: 10px; display: none; }
        .error-msg.show { display: block; }
        
        .stats-grid { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #16213e; border-radius: 12px; padding: 24px; border: 1px solid #1e2d50; text-align: center; }
        .stat-title { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 36px; font-weight: 700; color: #4fc3f7; margin-top: 10px; }
        
        .table-wrapper { overflow-x: auto; margin-top: 16px; min-height: 250px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { padding: 14px 12px; background: #111a30; color: #4fc3f7; border-bottom: 2px solid #2a3a5e; font-weight: 600; }
        td { padding: 14px 12px; border-bottom: 1px solid #1e2d50; color: #e0e0e0; }
        tr:hover { background: #1a2642; }
        .short-link-text { color: #4fc3f7; text-decoration: none; font-weight: 600; }
        .short-link-text:hover { text-decoration: underline; }
        .truncate { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
        .btn-text { background: none; border: none; color: #4fc3f7; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
        .btn-text:hover { color: #0288d1; }
        .btn-delete { color: #ef5350; }
        .btn-delete:hover { color: #d32f2f; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #16213e; border-radius: 12px; padding: 30px; width: 400px; max-width: 90%; border: 1px solid #2a3a5e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e2d50; font-size: 14px; }
        .stat-row:last-child { border-bottom: none; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .search-input { width: 250px; padding: 9px 14px; margin-top: 0; }
        .badge-expired { font-size: 10px; background: #ef5350; color: #fff; padding: 3px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; text-transform: uppercase; }
        .badge-expires-soon { font-size: 10px; background: #ffa000; color: #fff; padding: 3px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; text-transform: uppercase; }
        
        /* NEW: Pagination Styles */
        .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #1e2d50; padding-top: 15px; }
        .page-info { font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="navbar-brand">SmartLink AI</span>
        <div class="navbar-right">
            <span class="navbar-user" id="navUser"></span>
            <button class="btn-outline" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Links</div>
                <div class="stat-value" id="statTotalLinks">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Clicks</div>
                <div class="stat-value" id="statTotalClicks">...</div>
            </div>
        </div>

        <div class="card">
            <h3 style="color:#fff; font-size:18px; margin-bottom: 16px;">Create a Short Link</h3>
            <div style="display: flex; gap: 16px;">
                <div style="flex: 2;">
                    <label>Destination URL</label>
                    <input type="url" id="longUrl" placeholder="https://example.com/my-super-long-link" required />
                </div>
                <div style="flex: 1;">
                    <label>Custom Alias (Optional)</label>
                    <input type="text" id="customAlias" placeholder="e.g., my-campaign" />
                </div>
                <div style="flex: 1;">
                    <label>Expiration</label>
                    <select id="expiresIn">
                        <option value="">Never</option>
                        <option value="1">1 Day</option>
                        <option value="7">7 Days</option>
                        <option value="30">30 Days</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="shortenUrl()" style="margin-top: 20px;">Shorten URL</button>
            <p class="error-msg" id="errorMsg"></p>
        </div>

        <div class="card" id="resultCard" style="display: none; border-color: #4fc3f7;">
            <h4 style="color:#4fc3f7; margin-bottom: 10px;">Your link is ready!</h4>
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <input type="text" id="shortUrlResult" readonly style="background: #0f0f1a; border: 1px solid #2a3a5e; color: #4fc3f7; font-weight: bold;" />
                <button class="btn-outline" onclick="copyToClipboard()" style="margin-top: 0; padding: 11px 16px;">Copy</button>
            </div>
            <div style="text-align: center;">
                <img id="qrCodeImage" src="" alt="QR Code" style="border-radius: 8px; border: 4px solid #fff; max-width: 140px; display: none; margin: 0 auto;" />
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 style="color:#fff; font-size:18px; margin-bottom: 0;">Your Links</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search links..." onkeyup="filterLinks()" />
                    <button class="btn-outline" onclick="exportToCSV()" style="margin-top: 0; padding: 9px 14px; background: #0288d1; color: #fff;">Export CSV</button>
                </div>
            </div>
            
            <div class="table-wrapper">
                <table id="linksTable">
                    <thead>
                        <tr>
                            <th>Original URL</th>
                            <th>Short Link</th>
                            <th>Clicks</th>
                            <th>Date Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody">
                        <tr><td colspan="5" style="text-align: center; color: #aaa;">Loading your links...</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="noLinksMsg" style="color: #aaa; font-size: 13px; margin-top: 15px; display: none; text-align: center;">You haven't created any links yet.</p>
            
            <div class="pagination-container" id="paginationControls" style="display: none;">
                <button class="btn-outline" id="prevPageBtn" onclick="changePage(-1)">Previous</button>
                <span class="page-info" id="pageInfo">Page 1 of 1</span>
                <button class="btn-outline" id="nextPageBtn" onclick="changePage(1)">Next</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
            <h3 style="color: #4fc3f7; margin-bottom: 20px;">Click Analytics</h3>
            <div style="margin-bottom: 15px;">
                <h4 style="color: #aaa; font-size: 12px; text-transform: uppercase; margin-bottom: 8px;">Top Browsers</h4>
                <div id="browserStats"></div>
            </div>
            <div style="margin-bottom: 20px;">
                <h4 style="color: #aaa; font-size: 12px; text-transform: uppercase; margin-bottom: 8px;">Top Devices/OS</h4>
                <div id="osStats"></div>
            </div>
            <button class="btn" onclick="closeModal('statsModal')">Close Window</button>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <h3 style="color: #4fc3f7; margin-bottom: 20px;">Edit Destination URL</h3>
            <label>New Destination</label>
            <input type="url" id="editOriginalUrl" required />
            <input type="hidden" id="editUrlId" />
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" onclick="submitEdit()">Save Changes</button>
                <button class="btn-outline" style="width: 100%;" onclick="closeModal('editModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5000';
        const token = localStorage.getItem('smartlink_token');
        if (!token) window.location.href = 'login.html';

        const user = JSON.parse(localStorage.getItem('smartlink_user') || '{}');
        if (user.name) document.getElementById('navUser').textContent = user.name;

        // --- NEW: Pagination Variables ---
        let globalUrls = [];
        let currentFilteredUrls = []; // The search results we are currently paging through
        let currentPage = 1;
        const rowsPerPage = 5; // Change this to 10 or 20 for a real app!

        function logout() {
            localStorage.removeItem('smartlink_token');
            localStorage.removeItem('smartlink_user');
            window.location.href = 'login.html';
        }

        async function loadAnalytics() {
            try {
                const res = await fetch(`${BASE_URL}/api/analytics`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('statTotalLinks').textContent = data.totalLinks;
                    document.getElementById('statTotalClicks').textContent = data.totalClicks;
                }
            } catch (err) { console.error(err); }
        }

        // --- UPDATED: renderTable now handles slices of the array ---
        function renderTable() {
            const tbody = document.getElementById('linksTableBody');
            const noLinksMsg = document.getElementById('noLinksMsg');
            const linksTable = document.getElementById('linksTable');
            const paginationControls = document.getElementById('paginationControls');
            
            tbody.innerHTML = ''; 
            
            if (currentFilteredUrls.length === 0) {
                noLinksMsg.style.display = 'block'; 
                noLinksMsg.textContent = globalUrls.length === 0 ? "You haven't created any links yet." : "No links match your search.";
                linksTable.style.display = 'none'; 
                paginationControls.style.display = 'none';
                return;
            }
            
            linksTable.style.display = 'table'; 
            noLinksMsg.style.display = 'none';
            paginationControls.style.display = 'flex';

            // Pagination Math
            const totalPages = Math.ceil(currentFilteredUrls.length / rowsPerPage);
            
            // Safety check: if searching causes currentPage to be higher than total pages, reset to page 1
            if (currentPage > totalPages) currentPage = 1;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            
            // Grab only the 5 URLs for the current page
            const urlsToDisplay = currentFilteredUrls.slice(startIndex, endIndex);

            // Update UI text and buttons
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages;

            // Draw the 5 rows
            urlsToDisplay.forEach(url => {
                const shortUrlFull = `${BASE_URL}/${url.shortCode}`;
                const date = new Date(url.createdAt).toLocaleDateString();
                
                let badgeHtml = '';
                if (url.expiresAt) {
                    const expDate = new Date(url.expiresAt);
                    if (new Date() > expDate) badgeHtml = `<span class="badge-expired">Expired</span>`;
                    else badgeHtml = `<span class="badge-expires-soon">Ends ${expDate.toLocaleDateString()}</span>`;
                }
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="truncate" title="${url.originalUrl}">${url.originalUrl}</span></td>
                    <td><div style="display: flex; align-items: center;"><a href="${shortUrlFull}" target="_blank" class="short-link-text">${url.shortCode}</a>${badgeHtml}</div></td>
                    <td>${url.clicks.length}</td>
                    <td>${date}</td>
                    <td>
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <button onclick="openStats('${url._id}')" class="btn-outline">Stats</button>
                            ${url.qrCode ? `<a href="${url.qrCode}" download="qr-${url.shortCode}.png" class="short-link-text" style="font-size:12px;">QR</a>` : ''}
                            <button onclick="openEditModal('${url._id}', '${url.originalUrl}')" class="btn-text">Edit</button>
                            <button onclick="deleteUrl('${url._id}')" class="btn-text btn-delete">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- NEW: Change Page Trigger ---
        function changePage(direction) {
            currentPage += direction;
            renderTable();
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${BASE_URL}/api/my-urls`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error('Failed to fetch');
                globalUrls = await res.json(); 
                filterLinks(); // This populates currentFilteredUrls
            } catch (err) { console.error(err); }
        }

        function filterLinks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            // Save the results to our tracking variable
            currentFilteredUrls = globalUrls.filter(url => 
                url.originalUrl.toLowerCase().includes(query) || url.shortCode.toLowerCase().includes(query)
            );
            
            // Reset to page 1 every time they type a new search
            currentPage = 1;
            renderTable();
        }

        function refreshDashboard() { loadAnalytics(); loadHistory(); }
        refreshDashboard();

        function exportToCSV() {
            if (globalUrls.length === 0) { alert("No data to export!"); return; }
            let csvContent = "data:text/csv;charset=utf-8,Original URL,Short Code,Total Clicks,Creation Date,Expiration Date\n";
            globalUrls.forEach(url => {
                const date = new Date(url.createdAt).toLocaleDateString();
                const expDate = url.expiresAt ? new Date(url.expiresAt).toLocaleDateString() : "Never";
                const safeUrl = `"${url.originalUrl.replace(/"/g, '""')}"`;
                csvContent += `${safeUrl},${url.shortCode},${url.clicks.length},${date},${expDate}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", "smartlink_data_export.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function openStats(urlId) {
            const targetUrl = globalUrls.find(u => u._id === urlId);
            if (!targetUrl) return;
            const browserCounts = {}; const osCounts = {};
            targetUrl.clicks.forEach(click => {
                const b = click.browser || 'Unknown'; const o = click.device || 'Unknown';
                browserCounts[b] = (browserCounts[b] || 0) + 1; osCounts[o] = (osCounts[o] || 0) + 1;
            });
            const formatStats = (counts) => {
                const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
                if (entries.length === 0) return '<div class="stat-row" style="color:#aaa;">No clicks yet.</div>';
                return entries.map(([name, count]) => `<div class="stat-row"><span>${name}</span><span style="color:#4fc3f7; font-weight:bold;">${count}</span></div>`).join('');
            };
            document.getElementById('browserStats').innerHTML = formatStats(browserCounts);
            document.getElementById('osStats').innerHTML = formatStats(osCounts);
            document.getElementById('statsModal').classList.add('show');
        }

        function openEditModal(urlId, currentUrl) {
            document.getElementById('editUrlId').value = urlId;
            document.getElementById('editOriginalUrl').value = currentUrl;
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal(modalId) { document.getElementById(modalId).classList.remove('show'); }
        window.onclick = function(event) { if (event.target.classList.contains('modal-overlay')) event.target.classList.remove('show'); }

        async function submitEdit() {
            const urlId = document.getElementById('editUrlId').value;
            const originalUrl = document.getElementById('editOriginalUrl').value.trim();
            if (!originalUrl) { alert("Please enter a valid URL."); return; }
            try {
                const res = await fetch(`${BASE_URL}/api/${urlId}`, { 
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ originalUrl })
                });
                if (res.ok) { closeModal('editModal'); refreshDashboard(); } 
                else { alert('Failed to update URL. Please check your input.'); }
            } catch (err) { alert('Server error.'); }
        }

        async function deleteUrl(urlId) {
            if (!confirm("Are you sure you want to delete this link? This cannot be undone.")) return;
            try {
                const res = await fetch(`${BASE_URL}/api/${urlId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }});
                if (res.ok) refreshDashboard();
            } catch (err) { alert('Server error.'); }
        }

        async function shortenUrl() {
            const originalUrl = document.getElementById('longUrl').value.trim();
            const customAlias = document.getElementById('customAlias').value.trim();
            const expiresInVal = document.getElementById('expiresIn').value; 
            
            const btn = document.querySelector('.btn'); const errorMsg = document.getElementById('errorMsg');
            const resultCard = document.getElementById('resultCard'); const shortUrlResult = document.getElementById('shortUrlResult');
            const qrImg = document.getElementById('qrCodeImage');
            
            errorMsg.classList.remove('show'); resultCard.style.display = 'none'; qrImg.style.display = 'none';
            if (!originalUrl) { errorMsg.textContent = 'Please enter a valid URL'; errorMsg.classList.add('show'); return; }

            btn.disabled = true; btn.textContent = 'Generating...';
            const payload = { originalUrl, customAlias };
            if (expiresInVal) payload.expiresIn = parseInt(expiresInVal);

            try {
                const res = await fetch(`${BASE_URL}/api/shorten`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) { errorMsg.textContent = data.error || 'Failed to shorten link'; errorMsg.classList.add('show'); return; }

                document.getElementById('longUrl').value = ''; document.getElementById('customAlias').value = ''; document.getElementById('expiresIn').value = ''; 
                shortUrlResult.value = data.shortUrl;
                if (data.qrCode) { qrImg.src = data.qrCode; qrImg.style.display = 'block'; }
                
                resultCard.style.display = 'block'; document.getElementById('searchInput').value = '';
                
                // Jump back to page 1 to see the new link
                currentPage = 1;
                refreshDashboard();

            } catch (err) { errorMsg.textContent = 'Server error.'; errorMsg.classList.add('show');
            } finally { btn.disabled = false; btn.textContent = 'Shorten URL'; }
        }

        function copyToClipboard() {
            const copyText = document.getElementById("shortUrlResult"); copyText.select(); copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            const copyBtn = document.querySelector('#resultCard .btn-outline');
            copyBtn.textContent = 'Copied!'; copyBtn.style.background = '#4fc3f7'; copyBtn.style.color = '#000';
            setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.style.background = '#1e2d50'; copyBtn.style.color = '#aaa'; }, 2000);
        }
    </script>
</body>
</html>
